* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;

}

header {
    background: #1565c0;
    color: white;
    padding: 18px;

    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000012;
    text-align: center;
}

.card strong {
    display: block;
    font-size: 25px;
    margin-top: 5px;
}

    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 14px;
}

    color: white;
}
